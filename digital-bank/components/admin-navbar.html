<!-- =========================================================
     COMPONENT: Admin sidebar + topbar
     Loaded on every pages/admin/*.html page (except admin-login.html)
     by assets/js/admin/admin-layout.js via:
       <div data-component="admin-navbar"></div>

     Do not copy this markup into individual admin pages — edit it
     here only. admin-layout.js injects it, marks the active nav
     link, applies role-gating (data-min-role), populates the admin
     identity block, and wires logout + the mobile toggle. No
     per-page script needs to touch this markup directly.

     Deliberately NOT the same partial as components/app-navbar.html
     and NOT visually similar — see point 5 (visual differentiation)
     in the architecture doc. Structurally it's a left sidebar + a
     slim topbar rather than app-navbar's single horizontal header,
     which is itself part of the "obviously not the customer app"
     signal, independent of the color theme in admin.css.
     ========================================================= -->
