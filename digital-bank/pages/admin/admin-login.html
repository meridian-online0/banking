<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin sign in — Meridian</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<!--
  data-admin-auth="pending" hides the form while
  redirectIfAdminAuthenticated() checks for an existing valid admin
  session — mirrors the customer app's data-auth="pending" /
  .auth-loader pattern (see assets/js/auth-guard.js and
  supabase/auth.js's revealPage()), just under a different attribute
  name so it's obviously the admin-specific instance and never gets
  confused with the customer guard. admin.css needs the matching
  rules for this to actually hide anything:

    [data-admin-auth="pending"] .admin-login-card { visibility: hidden; }
    [data-admin-auth="pending"] .admin-login-loader { display: flex; }
    [data-admin-auth="ready"]   .admin-login-loader { display: none; }
-->
<body class="admin-body admin-login-body" data-admin-auth="pending">

  <main class="admin-login-shell">
    <div class="admin-login-loader admin-login-loader" aria-hidden="true">
      <span class="admin-login-loader-mark"></span>
    </div>

    <div class="admin-login-card">
      <div class="admin-login-brand">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="19" stroke="currentColor" stroke-width="1.3"/>
          <ellipse cx="20" cy="20" rx="19" ry="7.5" stroke="currentColor" stroke-width="1"/>
          <line x1="1" y1="20" x2="39" y2="20" stroke="currentColor" stroke-width="1"/>
          <line x1="20" y1="1" x2="20" y2="39" stroke="currentColor" stroke-width="1.3"/>
        </svg>
        <span>Meridian <em>Admin</em></span>
      </div>

      <!-- ===================================================
           Sign in — email + password only. Role check
           (support/admin/superadmin) still happens in
           admin-login.js; this is the single step now.
           =================================================== -->
      <form id="admin-login-step-credentials" class="admin-login-form" novalidate>
        <h1>Sign in</h1>
        <p class="admin-login-subtitle">Restricted access. All sign-ins are logged.</p>

        <p class="admin-login-error" id="credentials-error" role="alert" aria-live="polite"></p>

        <label class="admin-field">
          <span>Email</span>
          <input type="email" name="email" autocomplete="username" required>
        </label>

        <label class="admin-field">
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>

        <button type="submit" class="admin-btn admin-btn--primary">
          <span class="btn-label">Continue</span>
        </button>
      </form>
    </div>
  </main>

  <script type="module" src="./admin-login.js"></script>
</body>
</html>
