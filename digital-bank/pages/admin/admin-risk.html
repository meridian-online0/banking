<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Risk & fraud — Meridian Admin</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<link rel="stylesheet" href="../../assets/css/dashboard.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/admin-risk.css">
</head>
<body class="admin-body" data-auth="pending">
  <div class="admin-page-loader" aria-hidden="true">
    <span class="admin-page-loader-mark"></span>
  </div>
  <div data-component="admin-navbar"></div>
  <main class="admin-main">
    <div class="admin-container">

      <section class="admin-stat-row" id="risk-stat-row" aria-label="Risk flag summary">
        <div class="admin-stat-card admin-stat-card--danger"><span class="admin-stat-label">Active</span><span class="admin-stat-value">—</span></div>
        <div class="admin-stat-card admin-stat-card--warning"><span class="admin-stat-label">Escalated</span><span class="admin-stat-value">—</span></div>
        <div class="admin-stat-card"><span class="admin-stat-label">Resolved</span><span class="admin-stat-value">—</span></div>
      </section>

      <div class="admin-toolbar admin-toolbar--wrap">
        <div class="admin-search-field">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><path d="m17 17-3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input type="search" id="flag-search" placeholder="Search flag descriptions…">
        </div>
        <select id="status-filter">
          <option value="">All statuses</option>
          <option value="active">Active</option>
          <option value="escalated">Escalated</option>
          <option value="dismissed">Dismissed</option>
          <option value="resolved">Resolved</option>
        </select>
        <select id="severity-filter">
          <option value="">All severities</option>
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <span class="admin-toolbar-count" id="flag-count"></span>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Description</th>
              <th>Customer</th>
              <th>Type</th>
              <th>Severity</th>
              <th>Status</th>
              <th>Flagged</th>
            </tr>
          </thead>
          <tbody id="flag-table-body">
            <tr class="admin-table-skeleton-row"><td colspan="6">Loading flags…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="admin-pagination" id="flag-pagination" hidden></div>
    </div>
  </main>

  <!-- Flag detail drawer -->
  <div class="admin-drawer-overlay" id="flag-drawer-overlay" aria-hidden="true">
    <div class="admin-drawer">
      <div class="admin-drawer-head">
        <div class="admin-drawer-identity">
          <div>
            <h2 id="drawer-flag-type">Flag</h2>
            <p class="admin-drawer-subtitle" id="drawer-flag-customer">—</p>
          </div>
        </div>
        <button type="button" class="modal-close" id="flag-drawer-close" aria-label="Close">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 2l12 12M14 2 2 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="admin-drawer-body">
        <div class="admin-drawer-section">
          <h4>Details</h4>
          <div class="admin-detail-row"><span>Severity</span><span id="drawer-severity">—</span></div>
          <div class="admin-detail-row"><span>Status</span><span class="admin-status-pill" id="drawer-flag-status">—</span></div>
          <div class="admin-detail-row"><span>Flagged</span><span id="drawer-flag-date">—</span></div>
        </div>

        <div class="admin-drawer-section">
          <h4>Description</h4>
          <p id="drawer-description" class="admin-flag-description">—</p>
        </div>

        <div class="admin-drawer-section" id="drawer-tx-section" hidden>
          <h4>Related transaction</h4>
          <div class="admin-detail-row"><span>Reference</span><span id="drawer-tx-ref">—</span></div>
          <div class="admin-detail-row"><span>Amount</span><span id="drawer-tx-amount">—</span></div>
          <a href="admin-transactions.html" id="drawer-tx-link" class="admin-link-arrow">View in Transactions</a>
        </div>

        <div class="admin-drawer-footer admin-drawer-footer--wrap">
          <button type="button" class="admin-btn admin-btn--ghost admin-btn-sm" id="dismiss-btn">Dismiss</button>
          <button type="button" class="admin-btn admin-btn--warning admin-btn-sm" id="escalate-btn">Escalate</button>
          <button type="button" class="admin-btn admin-btn--success admin-btn-sm" id="resolve-flag-btn">Resolve</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reason modal, reused for dismiss/escalate/resolve -->
  <div class="modal-overlay" id="reason-modal">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h3 id="reason-modal-title">Confirm action</h3>
          <p id="reason-modal-subtitle">Add a note explaining this decision.</p>
        </div>
        <button type="button" class="modal-close" data-close-reason-modal aria-label="Close">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 2l12 12M14 2 2 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="reason-form">
        <div class="field">
          <label for="reason-input">Note</label>
          <textarea id="reason-input" rows="3"></textarea>
          <span class="field-error" id="reason-error"></span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close-reason-modal>Cancel</button>
          <button type="submit" class="admin-btn admin-btn--primary" id="reason-confirm-btn">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script type="module">
    import { loadComponents } from '../../components/components.js';
  </script>
  <script type="module" src="./admin-risk.js"></script>
</body>
</html>
