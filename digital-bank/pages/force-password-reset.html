
<!DOCTYPE html>
<html lang="en">
<head>
<!-- Fast, offline pre-check — this page requires a real logged-in
     session (unlike reset-password.html's recovery-link flow), so
     it follows the same authenticated-page pattern as accounts.html
     etc., not the visitor-facing auth.css page shell. -->
<script src="../assets/js/auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update your password — Meridian</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="app-body auth-pending" data-auth="pending">

<div class="auth-loader" aria-hidden="true"><span class="auth-loader-mark"></span></div>

<div class="auth-topbar">
  <div class="container">
    <span class="brand" aria-label="Meridian">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="19" stroke="#B58A44" stroke-width="1.3"/>
        <ellipse cx="20" cy="20" rx="19" ry="7.5" stroke="#B58A44" stroke-width="1"/>
        <line x1="1" y1="20" x2="39" y2="20" stroke="#B58A44" stroke-width="1"/>
        <line x1="20" y1="1" x2="20" y2="39" stroke="#D8B876" stroke-width="1.3"/>
      </svg>
      Meridian
    </span>
    <div class="auth-topbar-help">
      <span class="auth-topbar-status"><span class="status-dot"></span>All systems operational</span>
      <a href="../index.html#contact">Contact 24/7 support</a>
    </div>
  </div>
</div>

<!-- No navbar/nav links on purpose — this page blocks the rest of
     the app until the reset is done; requireAuth() will just send
     them straight back here anyway if they try to leave via a
     typed URL. -->
<main id="main-content" class="auth-main">
  <section class="auth-form-pane" style="margin-inline:auto;">
    <div class="auth-form-wrap">

      <div class="auth-form-head">
        <h1>Update your password</h1>
        <p>An administrator has required a password reset on this account before you can continue.</p>
      </div>

      <div class="auth-form-alert" role="alert" hidden>
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 6.5v4M10 13.2v.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="auth-form-alert-text"></span>
      </div>

      <form id="force-reset-form" novalidate>
        <div class="field">
          <label for="force-new-password">New password</label>
          <div class="password-field-wrap">
            <input type="password" id="force-new-password" name="new_password" autocomplete="new-password" placeholder="Enter a new password" minlength="10" required>
            <button type="button" class="password-toggle" aria-pressed="false" aria-label="Show password">
              <svg class="icon-show" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.4"/></svg>
              <svg class="icon-hide" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2.5 2.5l15 15M8.3 8.4a2.4 2.4 0 0 0 3.3 3.3M6.2 6.1C3.6 7.4 1.5 10 1.5 10s3 6 8.5 6c1.5 0 2.8-.4 3.9-1M13.9 5.2C12.7 4.5 11.4 4 10 4c-.4 0-.7 0-1.1.1M15.6 6.6c1.5 1.3 2.9 3.4 2.9 3.4s-.6 1.2-1.7 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <span class="field-error" role="alert"></span>
        </div>

        <div class="field">
          <label for="force-confirm-password">Confirm new password</label>
          <div class="password-field-wrap">
            <input type="password" id="force-confirm-password" name="new_password_confirm" autocomplete="new-password" placeholder="Re-enter your new password" minlength="10" required>
            <button type="button" class="password-toggle" aria-pressed="false" aria-label="Show password">
              <svg class="icon-show" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.4"/></svg>
              <svg class="icon-hide" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2.5 2.5l15 15M8.3 8.4a2.4 2.4 0 0 0 3.3 3.3M6.2 6.1C3.6 7.4 1.5 10 1.5 10s3 6 8.5 6c1.5 0 2.8-.4 3.9-1M13.9 5.2C12.7 4.5 11.4 4 10 4c-.4 0-.7 0-1.1.1M15.6 6.6c1.5 1.3 2.9 3.4 2.9 3.4s-.6 1.2-1.7 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <span class="field-error" role="alert"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block auth-submit-btn">
          <span class="auth-submit-label">Set new password</span>
          <span class="auth-submit-spinner" aria-hidden="true"></span>
        </button>
      </form>

    </div>
  </section>
</main>

<script src="../assets/js/main.js"></script>
<script type="module" src="force-password-reset.js"></script>
</body>
</html>
